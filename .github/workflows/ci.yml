# CI Futurisys — tests à chaque push / pull request vers master.
# Pas de Postgres ici : les tests API mockent la BDD ; le pickle + CSV suffisent.
#
# Secrets GitHub (Settings → Secrets and variables → Actions) :
#   API_KEY, DATABASE_URL  → utilisés plus tard (prod locale / déploiement)
#   En CI on injecte des valeurs factices, jamais le vrai .env.
#
# Environnements visés (démarche DevOps, déploiement local) :
#   dev  = machine locale (Docker + uvicorn)
#   test = ce workflow (pytest)
#   prod = API lancée pour la soutenance (même code que master)

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-not-a-real-secret
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Créer le venv et installer
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Lancer Pytest + couverture
        run: uv run pytest --cov-fail-under=70
